[project]
name = "City of Raton Phase 1"
time_zone = "America/Denver"
cadence = "daily"
run_time_local = "06:00"
review_sheet_name = "Phase 1 Review Queue"
source_scout_sheet_name = "Source Scout Queue"

[pilot]
geography = [
  "Raton, NM",
  "Northeastern New Mexico",
  "Southern Colorado",
]
radius_miles_min = 50
radius_miles_max = 100
geography_notes = "Use judgment for the logical surrounding area around Raton. Prefer caution when distance or relevance is ambiguous."

[quality]
minimum_required_fields = [
  "event_title",
  "start_date",
  "source_url",
]
minimum_required_location_fields = [
  "venue_name",
  "address",
  "city",
]
lookahead_days = 180
minimum_confidence_score = 0.75
drop_low_confidence_candidates = false

[review]
allowed_statuses = [
  "Pending",
  "Approved",
  "Rejected",
  "Needs Edit",
]
default_status = "Pending"

[export]
enable_google_sheets = true
enable_ics_export = true
export_only_approved_rows = true

[source_scout]
enabled = true
model = "gpt-5.4-mini"
reasoning_effort = "low"
max_candidates_per_run = 10
search_region = "Raton, New Mexico"
search_radius_miles = 100
approved_domains = [
  "ratonmainstreet.org",
  "ratonnm.gov",
  "exploreraton.com",
]
