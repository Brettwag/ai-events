name: Daily Phase 1 Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  phase1:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show scaffold summary
        run: python -m src.localist_ingestion.pipeline

      - name: Initialize review sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GOOGLE_SHEETS_SPREADSHEET_ID" ]; then
            echo "Google Sheets secrets are not set. Skipping review sheet initialization."
            exit 0
          fi
          python -m src.localist_ingestion.pipeline init-review-sheet
