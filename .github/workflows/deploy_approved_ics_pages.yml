name: Deploy Approved ICS Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy_approved_ics_pages.yml"
      - "src/localist_ingestion/**"
      - "config/runtime.toml"
      - "requirements.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build approved ICS Pages site
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GOOGLE_SHEETS_SPREADSHEET_ID" ]; then
            echo "Google Sheets secrets are required for ICS export."
            exit 1
          fi
          OWNER_LOWER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(printf '%s' "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          PUBLIC_ICS_URL="https://${OWNER_LOWER}.github.io/${REPO_LOWER}/approved-events.ics"
          python -m src.localist_ingestion.pipeline export-pages-site --output site --public-ics-url "$PUBLIC_ICS_URL"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
